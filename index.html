<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Prático - Formulário SENAI</title>
</head>
<body>

    <h1>Formulário de Cadastro</h1>
    
    <form>
        
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome Completo" required><br><br>

            <label for="email">E-Mail:</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu E-mail de Usuário" required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" minlength="6" maxlength="15" placeholder="Digite sua Senha" required><br><br>

            <label for="nascimento">Data de Nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento" required><br><br>

            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" minlength="11" maxlength="11" placeholder="Digite seu CPF (apenas números)" required><br><br>

            <label for="tel">Número de Telefone:</label><br>
            <input type="tel" id="tel" name="telefone" minlength="9" maxlength="13" placeholder="Digite seu Número de Telefone" required><br><br>

            <label for="Nome_da_Mae">Nome da sua Mãe:</label><br>
            <input type="text" id="Nome_da_Mae" name="nome_da_mae" placeholder="Digite o Nome Completo da sua Mãe" required><br><br>

            <label for="Nome_do_Pai">Nome do seu Pai:</label><br>
            <input type="text" id="Nome_do_Pai" name="nome_do_pai" placeholder="Digite o Nome Completo do seu Pai" required><br><br>

            <label for="estado_civil">Estado civil:</label><br>
            <select id="estado_civil" name="estado_civil" required>
                <option value="">-- Selecione --</option>
                <option value="solteiro">Solteiro</option>
                <option value="casado">Casado</option>
                <option value="uniao_estavel">União Estável</option>
                <option value="separado">Separado</option>
            </select><br><br>
            
        </fieldset>

        <br>

        <fieldset>
            <legend>Endereço</legend>

            <label for="rua">Rua:</label><br>
            <input type="text" id="rua" name="rua" placeholder="Nome da rua" required><br><br>

            <label for="numero">Número:</label><br>
            <input type="text" id="numero" name="numero" placeholder="Número" required><br><br>

            <label for="bairro">Bairro:</label><br>
            <input type="text" id="bairro" name="bairro" placeholder="Bairro" required><br><br>

            <label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade" required><br><br>

            <label for="estado">Estado:</label><br>
            <select id="estado" name="estado" required>
                <option value="">-- Selecione o Estado --</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select><br><br>

            <label for="cep">CEP:</label><br>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required><br><br>

            <label for="pais">País:</label><br>
            <input type="text" id="pais" name="pais" value="Brasil" required><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" id="masculino" name="sexo" value="masculino" required>
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="feminino" name="sexo" value="feminino" required>
            <label for="feminino">Feminino</label><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Tecnologias</legend>
            <input type="checkbox" id="html" name="tecnologias" value="html">
            <label for="html">HTML</label><br>

            <input type="checkbox" id="css" name="tecnologias" value="css">
            <label for="css">CSS</label><br>

            <input type="checkbox" id="javascript" name="tecnologias" value="javascript">
            <label for="javascript">JavaScript</label><br>

            <input type="checkbox" id="python" name="tecnologias" value="python">
            <label for="python">Python</label><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Comentários</legend>
            <label for="observacoes"> Comente sobre o que achou e o que pode melhorar </label><br><br>
            <textarea id="observacoes" name="observacoes" rows="5" cols="40" placeholder="Escreva suas observações aqui..." required></textarea>
        </fieldset>

        <br>

        <button type="submit">Enviar Cadastro</button>
        <button type="reset">Limpar Formulário</button>

    </form>

</body>
</html>
